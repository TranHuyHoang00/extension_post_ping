<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PostPing</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <img class="logo" src="icons/icon48.png" alt="" />
      <div class="brand">
        <div class="name">PostPing</div>
        <div class="group" id="groupName">—</div>
      </div>
      <span class="pill" id="statusPill">Đã dừng</span>
    </header>

    <div class="notice" id="notice" hidden></div>

    <section class="card" id="form">
      <label class="field">
        <span class="label">Từ khóa lọc</span>
        <textarea id="keywords" rows="1"></textarea>
        <span class="hint"
          >Cách nhau bằng dấu phẩy. Khớp một từ là được, không phân biệt hoa
          thường và dấu. Để trống để ghi mọi bài mới.</span
        >
      </label>

      <label class="field">
        <span class="label">Bình luận tự động</span>
        <textarea id="comments" rows="4"></textarea>
        <span class="hint"
          >Mỗi dòng là một bình luận. Khi có bài mới khớp từ khóa, chọn ngẫu
          nhiên một dòng để bình luận vào bài. Để trống để không tự bình
          luận.</span
        >
      </label>

      <div class="trio">
        <label class="field" title="Tần suất kiểm tra feed (tối thiểu 1 phút)">
          <span class="label">Kiểm tra mỗi (phút)</span>
          <input
            id="interval"
            type="number"
            min="1"
            max="1440"
            step="1"
            value="5"
          />
        </label>
        <label
          class="field"
          title="Chỉ bài đăng trong khoảng này mới tính là mới. 0 = không giới hạn. Không đọc được giờ đăng thì bài vẫn được tính."
        >
          <span class="label">Bài mới trong (phút)</span>
          <input id="maxAge" type="number" min="0" step="1" value="0" />
        </label>
        <label
          class="field"
          title="Bài đã bình luận được lưu để không bình luận lại; bản ghi quá số giờ này sẽ bị xóa. 0 = lưu mãi."
        >
          <span class="label">Xóa lịch sử (giờ)</span>
          <input id="clearHours" type="number" min="0" step="1" value="0" />
        </label>
      </div>
      <span class="hint"
        >Bài mới: chỉ tính bài đăng trong khoảng này (0 = không giới hạn). Xóa
        lịch sử: bài đã bình luận được nhớ để không bình luận lại, quá số giờ
        này thì xóa (0 = lưu mãi).</span
      >

      <div class="actions">
        <button id="toggleBtn" class="primary">Bắt đầu</button>
        <button id="checkBtn" class="ghost" disabled>Kiểm tra ngay</button>
      </div>
      <div class="actions">
        <button
          id="testBtn"
          class="ghost"
          title="Comment thử vào bài đầu tiên trên feed"
        >
          Test Comment
        </button>
        <button
          id="historyBtn"
          class="ghost"
          title="Xóa hết lịch sử bài đã bình luận trong IndexedDB"
        >
          Xóa lịch sử
        </button>
      </div>

      <dl class="meta">
        <div>
          <dt>Lần kiểm tra cuối</dt>
          <dd id="lastCheck">—</dd>
        </div>
        <div>
          <dt>Lần tới</dt>
          <dd id="nextCheck">—</dd>
        </div>
        <div>
          <dt>Bài mới / Comment</dt>
          <dd id="stats">0 / 0</dd>
        </div>
      </dl>
    </section>

    <section class="terminal">
      <div class="term-bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="term-title">post-ping — log</span>
        <button id="clearBtn" class="term-btn" title="Xóa toàn bộ log">
          Xóa log
        </button>
      </div>
      <div class="term-body" id="log">
        <div class="empty" id="emptyLog">$ chưa có log</div>
      </div>
    </section>

    <script src="sidepanel.js"></script>
  </body>
</html>
